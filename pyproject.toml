[project]
name = "treechat"
version = "0.1.0"
description = "Local tree-structured chat with anchored, parkable, mergeable tangents"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "anthropic>=1.13,<2",
]

[project.scripts]
treechat = "treechat.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "httpx",
    "pyright",
    "ruff",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treechat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
markers = ["live: calls the real LLM provider and costs money; run only with the owner's go-ahead (Req 17.5)"]

[tool.pyright]
include = ["treechat", "tests"]
strict = ["treechat"]
pythonVersion = "3.14"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
